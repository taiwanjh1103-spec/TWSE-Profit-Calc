<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股買進後賣多少才賺？</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <style>
        :root {
            --primary: #007bff;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --profit: #d9534f;
            --border: #cccccc;
            --subtle-gray: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .calc-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            transition: max-width 0.3s ease;
        }

        .title {
            font-size: 19px;
            font-weight: bold;
            text-align: center;
            margin: 0 0 14px 0;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 電腦版 (>= 768px) 雙欄排版 */
        @media (min-width: 768px) {
            .calc-card {
                max-width: 820px;
                padding: 24px;
            }
            .calc-body {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                align-items: start;
            }
            .result-box {
                margin-top: 0 !important;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-sizing: border-box;
            }
        }

        /* 熱門股票區塊 */
        .stock-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 10px;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .stock-title {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .subtle-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 10.5px;
            cursor: pointer;
            color: #475569;
            transition: all 0.15s;
        }

        .subtle-btn:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
        }

        .stock-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 5px;
        }

        .chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
            color: #475569;
            transition: all 0.15s;
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .stock-search-box {
            display: flex;
            gap: 4px;
        }

        .stock-search-box input {
            flex: 1;
            padding: 4px 6px;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .stock-search-btn {
            background: #64748b;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .stock-search-btn:hover {
            background: #475569;
        }

        .stock-status {
            font-size: 10.5px;
            color: #64748b;
            margin-top: 3px;
            min-height: 14px;
        }

        /* 主要表單區塊 */
        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            overflow: hidden;
            transition: border-color 0.15s;
        }

        .input-wrapper input {
            border: none !important;
            border-radius: 0 !important;
            flex: 1;
            padding: 8px 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            width: 100%;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .input-unit {
            padding: 0 10px;
            font-size: 13px;
            color: #475569;
            background: #f8fafc;
            border-left: 1px solid #e2e8f0;
            align-self: stretch;
            display: flex;
            align-items: center;
            user-select: none;
            font-weight: 600;
            white-space: nowrap;
        }

        .custom-discount {
            margin-top: 4px;
        }

        .seg-group {
            display: flex;
            background: #e9ecef;
            padding: 2px;
            border-radius: 6px;
            gap: 2px;
        }

        .seg-btn {
            flex: 1;
            padding: 7px 2px;
            border: none;
            background: transparent;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .seg-btn.active {
            background: #fff;
            font-weight: bold;
            color: var(--primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .seg-btn:disabled { opacity: 0.35; }

        .result-box {
            margin-top: 10px;
            background: #f8f9fa;
            border: 1px solid #e2e6ea;
            border-radius: 8px;
            padding: 12px;
        }

        .result-title {
            font-size: 14px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13.5px;
            color: #555;
            margin-bottom: 6px;
        }

        .breakeven-container {
            text-align: center;
            margin: 8px 0;
            padding-top: 8px;
            border-top: 1px dashed #ccc;
        }

        .breakeven-label {
            font-size: 12.5px;
            color: #666;
        }

        .breakeven-price {
            font-size: 26px;
            font-weight: bold;
            color: var(--profit);
        }

        .ladder-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
            font-size: 12.5px;
        }

        .ladder-table th, .ladder-table td {
            padding: 5px 2px;
            text-align: right;
        }

        .ladder-table th {
            color: #777;
            font-weight: normal;
            border-bottom: 1px solid #e9ecef;
        }

        .ladder-table tr.active-row {
            color: var(--profit);
            font-weight: bold;
            background-color: #fff1f1;
        }

        .disclaimer {
            margin-top: 12px;
            font-size: 10px;
            color: #999999;
            text-align: center;
            line-height: 1.3;
            border-top: 1px solid #eeeeee;
            padding-top: 6px;
        }
    </style>
</head>
<body>

<div class="calc-card">
    <div class="title">📈 台股買進後賣多少才賺？</div>

    <div class="calc-body">
        <!-- 輸入設定區 -->
        <div class="input-section">
            <div class="stock-section">
                <div class="stock-header">
                    <span class="stock-title">熱門股票</span>
                    <div class="header-actions">
                        <button type="button" class="subtle-btn" onclick="drawGachaStock()">🎰 抽股票</button>
                        <button type="button" class="subtle-btn" onclick="renderHotStocks()">🔄 換一組</button>
                    </div>
                </div>
                <div class="stock-chips" id="stockChips"></div>
                <div class="stock-search-box">
                    <input type="text" id="symbolInput" placeholder="輸入代號或公司名稱 (如: 2330 或 台積電)" onfocus="this.select()" onkeypress="if(event.key==='Enter') searchCustomStock()">
                    <button type="button" class="stock-search-btn" onclick="searchCustomStock()">查詢價格</button>
                </div>
                <div class="stock-status" id="stockStatus"></div>
            </div>

            <div class="form-group">
                <label for="buyPrice">買入股價</label>
                <div class="input-wrapper">
                    <input type="number" id="buyPrice" step="0.01" value="50" onfocus="this.select()" oninput="calculate()">
                    <span class="input-unit">元</span>
                </div>
            </div>

            <div class="form-group">
                <label>買入數量</label>
                <div style="display: flex; gap: 6px;">
                    <div class="input-wrapper" style="flex: 1;">
                        <input type="number" id="qty" value="1" min="1" onfocus="this.select()" oninput="calculate()">
                    </div>
                    <div class="seg-group" style="width: 100px;">
                        <button type="button" class="seg-btn active" id="btnSheet" onclick="setUnit('sheet')">張</button>
                        <button type="button" class="seg-btn" id="btnShare" onclick="setUnit('share')">股</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>券商手續費折數</label>
                <div class="seg-group" id="discountGroup">
                    <button type="button" class="seg-btn" onclick="setDiscount(0, this)">0折(免)</button>
                    <button type="button" class="seg-btn" onclick="setDiscount(1.68, this)">1.68折</button>
                    <button type="button" class="seg-btn active" onclick="setDiscount(2.8, this)">2.8折</button>
                    <button type="button" class="seg-btn" onclick="setDiscount(6, this)">6折</button>
                </div>
                <div class="input-wrapper custom-discount">
                    <input type="number" id="customDiscount" placeholder="輸入折數 (如 2.5)" step="0.01" onfocus="this.select()" oninput="onCustomDiscountInput()">
                    <span class="input-unit">折</span>
                </div>
            </div>

            <div class="form-group">
                <label for="minFee">手續費低消</label>
                <div class="input-wrapper">
                    <input type="number" id="minFee" value="20" onfocus="this.select()" oninput="calculate()">
                    <span class="input-unit">元</span>
                </div>
            </div>

            <div class="form-group">
                <label>交易類型 (交易稅)</label>
                <div class="seg-group" id="taxGroup">
                    <button type="button" class="seg-btn active" id="taxNormal" onclick="setTax(0.003, this)">一般 (0.3%)</button>
                    <button type="button" class="seg-btn" id="taxDay" onclick="setTax(0.0015, this)">當沖 (0.15%)</button>
                    <button type="button" class="seg-btn" id="taxEtf" onclick="setTax(0.001, this)">ETF (0.1%)</button>
                </div>
            </div>
        </div>

        <!-- 結果顯示區 -->
        <div class="result-section">
            <div class="result-box">
                <div>
                    <!-- 新增標題：損益平衡計算機 -->
                    <div class="result-title">⚖️ 損益平衡計算機</div>

                    <div class="summary-row">
                        <span>買入總成本：</span>
                        <span><b id="totalCost" style="color:#111;">0</b> 元</span>
                    </div>
                    <div class="summary-row">
                        <span>買入手續費：</span>
                        <span><span id="buyFee">0</span> 元</span>
                    </div>

                    <div class="breakeven-container">
                        <div class="breakeven-label">保本最低賣價</div>
                        <div class="breakeven-price"><span id="breakevenPrice">0.00</span> 元</div>
                    </div>

                    <table class="ladder-table">
                        <thead>
                            <tr>
                                <th style="text-align: left;">賣出價位</th>
                                <th>預估淨利</th>
                                <th>報酬率</th>
                            </tr>
                        </thead>
                        <tbody id="ladderBody"></tbody>
                    </table>
                </div>

                <div class="disclaimer">
                    免責聲明：本工具計算結果僅供參考，實際交易費用以各大證券商與台灣證券交易所最新規範為準。本網站不保證資訊之即時性與精確性，亦不構成任何形式之投資建議或買賣指示。
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let stockData = {};
    let updatedAt = '';

    const stockPool = [
        { code: '2330', name: '台積電', p: 980 }, { code: '2317', name: '鴻海', p: 200 },
        { code: '2454', name: '聯發科', p: 1250 }, { code: '2382', name: '廣達', p: 280 },
        { code: '3231', name: '緯創', p: 110 },   { code: '2308', name: '台達電', p: 390 },
        { code: '2881', name: '富邦金', p: 85 },   { code: '2882', name: '國泰金', p: 63 },
        { code: '2886', name: '兆豐金', p: 39 },   { code: '2603', name: '長榮', p: 185 },
        { code: '2303', name: '聯電', p: 54 },     { code: '3017', name: '奇鋐', p: 610 },
        { code: '0050', name: '元大台灣50', p: 175 }, { code: '0056', name: '元大高股息', p: 38 },
        { code: '00878', name: '國泰永續高股息', p: 22.5 }, { code: '00919', name: '群益台灣精選高息', p: 24.5 },
        { code: '00929', name: '復華台灣科技優息', p: 19.5 }, { code: '00940', name: '元大台灣價值高息', p: 9.6 },
        { code: '00713', name: '元大台灣高息低波', p: 57 }, { code: '006208', name: '富邦台50', p: 105 }
    ];

    let currentUnit = 'sheet';
    let currentDiscount = 2.8;
    let currentTaxRate = 0.003;

    window.onload = async function() {
        renderHotStocks();
        await loadStockJson();

        let savedDiscount = localStorage.getItem('tw_discount');
        if (savedDiscount !== null) {
            let val = parseFloat(savedDiscount);
            let btnIndex = -1;
            if (val === 0) btnIndex = 0;
            else if (val === 1.68) btnIndex = 1;
            else if (val === 2.8) btnIndex = 2;
            else if (val === 6) btnIndex = 3;

            let btns = document.querySelectorAll('#discountGroup .seg-btn');
            if (btnIndex !== -1) {
                setDiscount(val, btns[btnIndex]);
            } else {
                document.getElementById('customDiscount').value = val;
                onCustomDiscountInput();
            }
        } else {
            setDiscount(2.8, document.querySelectorAll('#discountGroup .seg-btn')[2]);
        }

        if (localStorage.getItem('tw_minFee')) {
            document.getElementById('minFee').value = localStorage.getItem('tw_minFee');
        }
        calculate();
    };

    async function loadStockJson() {
        try {
            let res = await fetch('./stocks.json');
            if(!res.ok) throw new Error();
            let data = await res.json();
            stockData = data.stocks || {};
            updatedAt = data.updated_at || '';
            // 不在畫面上顯示「提示：全台股資料庫已就緒」
        } catch (e) {}
    }

    function drawGachaStock() {
        let keys = Object.keys(stockData);
        let poolKeys = keys.length > 0 ? keys : stockPool.map(s => s.code);
        if (poolKeys.length === 0) return;

        let statusEl = document.getElementById('stockStatus');
        let counter = 0;
        
        let timer = setInterval(() => {
            let tempCode = poolKeys[Math.floor(Math.random() * poolKeys.length)];
            let tempName = stockData[tempCode] ? stockData[tempCode].n : (stockPool.find(s=>s.code===tempCode)?.name || tempCode);
            statusEl.innerHTML = `<span style="color:#64748b; font-weight:bold;">🎰 轉蛋中... ${tempCode} ${tempName}</span>`;
            
            counter++;
            if (counter >= 10) {
                clearInterval(timer);
                let finalCode = poolKeys[Math.floor(Math.random() * poolKeys.length)];
                let finalObj = stockData[finalCode];
                let finalName = finalObj ? finalObj.n : (stockPool.find(s=>s.code===finalCode)?.name || finalCode);
                
                selectStock(finalCode, finalName);
            }
        }, 50);
    }

    function renderHotStocks() {
        let shuffled = [...stockPool].sort(() => 0.5 - Math.random());
        let selected = shuffled.slice(0, 5);
        let chipsContainer = document.getElementById('stockChips');
        chipsContainer.innerHTML = '';
        selected.forEach(stk => {
            let btn = document.createElement('button');
            btn.className = 'chip';
            btn.type = 'button';
            btn.innerText = `${stk.code} ${stk.name}`;
            btn.onclick = () => selectStock(stk.code, stk.name);
            chipsContainer.appendChild(btn);
        });
    }

    function selectStock(code, fallbackName) {
        let statusEl = document.getElementById('stockStatus');
        let inputEl = document.getElementById('symbolInput');
        
        inputEl.value = code;

        let target = stockData[code];
        let dateStr = updatedAt ? updatedAt.split(' ')[0] : '';
        let dateTag = dateStr ? `[${dateStr}] ` : '';

        if (target) {
            document.getElementById('buyPrice').value = target.p;
            statusEl.innerHTML = `<span style="color:#28a745;">已帶入 <b>${code} ${target.n}</b> ${dateTag}收盤價：<b>${target.p}</b> 元</span>`;
        } else {
            let poolItem = stockPool.find(s => s.code === code);
            if (poolItem && poolItem.p) {
                document.getElementById('buyPrice').value = poolItem.p;
                statusEl.innerHTML = `<span style="color:#28a745;">已帶入 <b>${code} ${poolItem.name}</b> 參考價：<b>${poolItem.p}</b> 元</span>`;
            } else {
                statusEl.innerHTML = `<span style="color:#d9534f;">尚未收錄代號 ${code}，請手動輸入股價。</span>`;
            }
        }

        if (code.startsWith('00')) {
            setTax(0.001, document.getElementById('taxEtf'));
        } else if (currentTaxRate === 0.001) {
            setTax(0.003, document.getElementById('taxNormal'));
        }
        calculate();
    }

    // 搜尋功能升級：支援「股票代號」與「公司名稱」搜尋
    function searchCustomStock() {
        let val = document.getElementById('symbolInput').value.trim();
        if (!val) return;

        let statusEl = document.getElementById('stockStatus');

        // 1. 若為代號，精確比對
        if (stockData[val]) {
            selectStock(val);
            return;
        }

        // 2. 名稱比對 (stockData)
        let foundCode = Object.keys(stockData).find(code => {
            let name = stockData[code].n;
            return name === val || name.includes(val);
        });

        if (foundCode) {
            selectStock(foundCode);
            return;
        }

        // 3. 名稱/代號比對 (stockPool 備援庫)
        let poolItem = stockPool.find(s => s.code === val || s.name === val || s.name.includes(val));
        if (poolItem) {
            selectStock(poolItem.code);
            return;
        }

        // 4. 無匹配結果
        statusEl.innerHTML = `<span style="color:#d9534f;">查無 「${val}」 相關股票或收盤價，請手動輸入股價。</span>`;
    }

    function setUnit(unit) {
        currentUnit = unit;
        document.getElementById('btnSheet').classList.toggle('active', unit === 'sheet');
        document.getElementById('btnShare').classList.toggle('active', unit === 'share');
        
        let qtyInput = document.getElementById('qty');
        let dayBtn = document.getElementById('taxDay');

        if (unit === 'share') {
            qtyInput.value = 100;
            dayBtn.disabled = true;
            if (currentTaxRate === 0.0015) setTax(0.003, document.getElementById('taxNormal'));
        } else {
            qtyInput.value = 1;
            dayBtn.disabled = false;
        }
        qtyInput.select();
        calculate();
    }

    function setDiscount(val, btn) {
        document.querySelectorAll('#discountGroup .seg-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        
        document.getElementById('customDiscount').value = val;
        currentDiscount = val;
        localStorage.setItem('tw_discount', val);
        calculate();
    }

    function onCustomDiscountInput() {
        let val = parseFloat(document.getElementById('customDiscount').value);
        let btns = document.querySelectorAll('#discountGroup .seg-btn');
        btns.forEach(b => b.classList.remove('active'));
        
        if (!isNaN(val)) {
            currentDiscount = val;
            localStorage.setItem('tw_discount', val);
            
            if (val === 0) btns[0].classList.add('active');
            else if (val === 1.68) btns[1].classList.add('active');
            else if (val === 2.8) btns[2].classList.add('active');
            else if (val === 6) btns[3].classList.add('active');
        } else {
            currentDiscount = 10;
        }
        calculate();
    }

    function setTax(rate, btn) {
        document.querySelectorAll('#taxGroup .seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTaxRate = rate;
        calculate();
    }

    function getNextTick(price) {
        price = parseFloat(price.toFixed(2));
        if (price < 10) return parseFloat((price + 0.01).toFixed(2));
        if (price < 50) return parseFloat((price + 0.05).toFixed(2));
        if (price < 100) return parseFloat((price + 0.10).toFixed(2));
        if (price < 500) return parseFloat((price + 0.50).toFixed(2));
        if (price < 1000) return parseFloat((price + 1.00).toFixed(2));
        return parseFloat((price + 5.00).toFixed(2));
    }

    function calculate() {
        let buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
        let qtyNum = parseInt(document.getElementById('qty').value) || 0;
        let totalShares = currentUnit === 'sheet' ? qtyNum * 1000 : qtyNum;
        let minFee = parseInt(document.getElementById('minFee').value) || 0;
        localStorage.setItem('tw_minFee', minFee);

        let feeRate = 0.001425 * (currentDiscount / 10);
        let buyBase = Math.round(buyPrice * totalShares);
        let buyFee = (currentDiscount === 0) ? 0 : Math.max(minFee, Math.floor(buyBase * feeRate));
        let totalBuyCost = buyBase + buyFee;

        document.getElementById('totalCost').innerText = totalBuyCost.toLocaleString();
        document.getElementById('buyFee').innerText = buyFee.toLocaleString();

        if (buyPrice <= 0 || totalShares <= 0) return;

        let currentSell = buyPrice;
        let breakevenPrice = 0;
        let rows = [];

        while (true) {
            currentSell = getNextTick(currentSell);
            let sellBase = Math.round(currentSell * totalShares);
            let sellFee = (currentDiscount === 0) ? 0 : Math.max(minFee, Math.floor(sellBase * feeRate));
            let sellTax = Math.floor(sellBase * currentTaxRate);
            let profit = (sellBase - sellFee - sellTax) - totalBuyCost;

            if (profit > 0 && breakevenPrice === 0) {
                breakevenPrice = currentSell;
                rows.push({ p: currentSell, gain: profit, roi: (profit / totalBuyCost * 100).toFixed(2), label: '保本' });
                
                let temp = currentSell;
                for (let i = 1; i <= 3; i++) {
                    temp = getNextTick(temp);
                    let sBase = Math.round(temp * totalShares);
                    let sFee = (currentDiscount === 0) ? 0 : Math.max(minFee, Math.floor(sBase * feeRate));
                    let sTax = Math.floor(sBase * currentTaxRate);
                    let g = (sBase - sFee - sTax) - totalBuyCost;
                    rows.push({ p: temp, gain: g, roi: (g / totalBuyCost * 100).toFixed(2), label: `+${i}檔` });
                }
                break;
            }
            if (currentSell > buyPrice * 3) break;
        }

        document.getElementById('breakevenPrice').innerText = breakevenPrice.toFixed(2);

        let tbody = document.getElementById('ladderBody');
        tbody.innerHTML = '';
        rows.forEach((r, idx) => {
            let tr = document.createElement('tr');
            if (idx === 0) tr.className = 'active-row';
            tr.innerHTML = `
                <td style="text-align: left;">${r.p.toFixed(2)} 元 <span style="font-size:11px; color:#888;">(${r.label})</span></td>
                <td>+${r.gain.toLocaleString()} 元</td>
                <td>+${r.roi}%</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
